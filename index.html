<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicTacSchedule - Daily Balance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>TicTacToe</h1>
      <p>Complete your daily tasks to balance your day and win the tic-tac-toe!</p>
    </header>

    <div class="game-wrapper">
      <div id="message-display" class="message-banner"></div>

      <div id="grid-container" class="grid-layout">
      </div>
    </div>

    <div class="controls">
      <button id="finish-btn" class="primary-button">Finish Day</button>
      <button id="reset-btn" class="secondary-button">Reset Progress</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
